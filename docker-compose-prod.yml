services:
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres_prod
    restart: unless-stopped
    env_file:
      - ./src/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-rag_service}
      POSTGRES_USER: ${DB_USER:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_password}
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_user} -d ${DB_NAME:-rag_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local

  app:
    image: ${IMAGE_NAME:-rag-service}:${IMAGE_TAG:-latest}
    restart: always
    container_name: rag_app_prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8521}:8000"
    volumes:
      - ./src/logs:/app/src/logs
    env_file:
      - ./src/.env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6579}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Rnm6l2ThNoNNmBwi}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - local

networks:
  local:
    external: true
    name: '${NETWORK_NAME:-do_utg_network}'

volumes:
  rag-postgres-data:
    driver: local