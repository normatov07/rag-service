services:

  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: unless-stopped
    env_file:
      - ./src/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-rag_service}
      POSTGRES_USER: ${DB_USER:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_password}
    ports:
      - "${OUTER_DB_PORT:-5541}:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - rag-qdrant-data:/qdrant/storage
    networks:
      - local

  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    restart: always
    container_name: rag_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8521}:8000"
      - "${FLOWER_PORT:-5554}:5555"
    volumes:
      - ./src:/app/src
      - ./docker:/app/src/docker:ro
    env_file:
      - ./src/.env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - local

networks:
  local:
    name: '${NETWORK_NAME:-rag_service_network}'

volumes:
  rag-postgres-data:
    driver: local
  rag-qdrant-data:
    driver: local